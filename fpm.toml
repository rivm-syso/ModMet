name = "ModMet"
version = "v1.0.1"
license = "LICENCE"
author = "Marte Voorneveld"
maintainer = "marte.voorneveld@rivm.nl"
copyright = "Copyright 2026, Marte Voorneveld"

[build]
auto-executables = true
auto-tests = true
auto-examples = true
module-naming = false

[install]
library = false
test = false

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"

[dev-dependencies]
test-drive.git = "https://github.com/fortran-lang/test-drive"

[extra.fortitude.check]
line-length = 101 # 100 + 1 for the newline character
